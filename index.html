<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice Media Uploader</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- QR Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- LameJS for MP3 Conversion -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow"></div>

    <div class="container">
        <header>
            <h1>Alice Box <span>Uploader</span></h1>
            <p>Envoyez un média vers Alice et obtenez le QR Code magie.</p>
        </header>

        <!-- Configuration Section (Token) -->
        <section class="config-section" id="configSection">
            <div class="input-group">
                <label for="githubToken">GitHub Token (PAT)</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                <button id="saveTokenBtn">Sauvegarder</button>
            </div>
            <p class="hint">Nécessite le scope <code>repo</code> ou_public_repo`.</p>
        </section>

        <!-- Upload Section -->
        <section class="upload-section glass-panel">
            <div class="drop-zone" id="dropZone">
                <div class="icon-container">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16V8M12 8L9 11M12 8L15 11" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M3 15V16C3 18.2091 4.79086 20 7 20H17C19.2091 20 21 18.2091 21 16V15"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <h3>Glissez un fichier ici</h3>
                <p>ou cliquez pour parcourir (MP3, WAV, MP4)</p>
                <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.mkv,.ogg">
            </div>

            <div class="progress-container hidden" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="progressText">0%</span>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section hidden" id="resultSection">
            <div class="glass-panel success-panel">
                <h2>C'est prêt !</h2>
                <div id="qrcode" class="qr-container"></div>
                <p class="filename" id="uploadedFilename">mon_son.mp3</p>
                <button class="btn-primary" onclick="resetApp()">Nouveau fichier</button>
            </div>
        </section>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">Message ici</div>

    <script src="app.js"></script>
</body>

</html>
