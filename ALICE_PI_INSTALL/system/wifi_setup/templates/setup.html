<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racontine Setup</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #9d4edd;
            --primary-glow: #c77dff;
            --secondary: #3c096c;
            --bg-dark: #10002b;
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #00b894;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #240046 0%, #10002b 100%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        h1 span {
            color: var(--primary-glow);
        }

        .status-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-item code {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary-glow);
        }

        h3 {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary-glow);
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            /* Important pour pas déborder */
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: var(--primary-glow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.4);
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Racontine <span>Setup</span></h1>

        <div class="status-box">
            <div class="status-item">
                <span>Volume par défaut</span>
                <strong>{{ volume }}%</strong>
            </div>
            <div class="status-item">
                <span>Adresse du Hotspot</span>
                <code>{{ ip_address }}</code>
            </div>
        </div>

        <form action="/configure" method="POST">
            <h3>Configuration WiFi</h3>

            <div class="form-group">
                <label for="ssid">Nom du WiFi (SSID)</label>
                <input type="text" id="ssid" name="ssid" placeholder="Ex: Livebox-1234">
            </div>

            <div class="form-group">
                <label for="psk">Mot de passe WiFi</label>
                <input type="password" id="psk" name="psk" placeholder="Clé de sécurité">
            </div>

            <div class="form-group">
                <label for="volume">Volume au démarrage (optionnel)</label>
                <input type="number" id="volume" name="volume" value="{{ volume }}" min="0" max="100">
            </div>

            <button type="submit">💾 Sauvegarder & Connecter</button>
        </form>

        <div class="footer">
            Le système redémarrera automatiquement après la sauvegarde.
        </div>
    </div>
</body>

</html>
